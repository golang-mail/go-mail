<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Go Mail</title>
    <script nonce="__CSP_NONCE__">
        (function() {
            var theme = localStorage.getItem('go-mail-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="/static/fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f6f8fc;
            --card-bg: #ffffff;
            --text-color: #202124;
            --secondary-text: #5f6368;
            --border-color: #dadce0;
        }

        [data-theme="dark"] {
            --primary-color: #8ab4f8;
            --primary-hover: #aecbfa;
            --bg-color: #1f1f1f;
            --card-bg: #2d2d2d;
            --text-color: #e8eaed;
            --secondary-text: #9aa0a6;
            --border-color: #3c4043;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 48px 40px 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-header .logo svg {
            width: 28px;
            height: 28px;
            fill: var(--card-bg);
        }

        .login-header h1 {
            margin: 0 0 8px 0;
            color: var(--text-color);
            font-size: 24px;
            font-weight: 400;
        }

        .login-header p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary-text);
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            background-color: var(--card-bg);
            transition: border-color 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            color: var(--card-bg);
            background-color: var(--primary-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <h1>Go Mail</h1>
            <p>Sign in to continue</p>
        </div>
        <form action="/api/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
